<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fred D. | Automation systems for service businesses and agencies</title>
    <meta name="description" content="Fred builds the lead capture, CRM, booking and AI automation that runs service businesses and agencies in the background. n8n, Make, GoHighLevel and custom code." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              base: 'var(--bg-base)',
              paper: 'var(--bg-base)',
              surface: 'var(--bg-surface)',
              line: 'var(--line)',
              ink: 'var(--ink)',
              muted: 'var(--muted)',
              accent: 'var(--accent)',
              'accent-soft': 'var(--accent-soft)',
              'accent-ink': 'var(--accent-ink)',
            },
            maxWidth: {
              page: '72rem',
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --bg-base: #f7f8f6;
        --bg-surface: #ffffff;
        --line: #e1e5df;
        --ink: #141815;
        --muted: #5d655f;
        --accent: #1f7a4d;
        --accent-soft: #e3f1e9;
        --accent-ink: #ffffff;
      }
      .dark {
        --bg-base: #0f1210;
        --bg-surface: #161a17;
        --line: #262c28;
        --ink: #f1f3ef;
        --muted: #9aa39d;
        --accent: #4cc48a;
        --accent-soft: #163424;
        --accent-ink: #0f1210;
      }

      html {
        scroll-behavior: smooth;
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }

      body {
        background-color: var(--bg-base);
        color: var(--ink);
        overflow-x: hidden;
        width: 100%;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      a:focus-visible, button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      ::selection {
        background: var(--accent);
        color: var(--accent-ink);
      }
    </style>
    <script>
      if (localStorage.theme === 'dark') {
        document.documentElement.classList.add('dark')
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
