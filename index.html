<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fred D. — AI &amp; Automation Systems Builder</title>
    <meta name="description" content="I design and build AI-driven automation systems — n8n, Make, Zapier, GoHighLevel and custom code — that run your operations in the background." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['Sora', 'sans-serif'],
              sans: ['"Hanken Grotesk"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              base: 'var(--bg-base)',
              section: 'var(--bg-section)',
              surface: 'var(--bg-surface)',
              elevated: 'var(--bg-elevated)',
              subtle: 'var(--border-subtle)',
              strong: 'var(--border-strong)',
              accent: {
                DEFAULT: 'var(--accent)',
                bright: 'var(--accent-bright)',
                node: 'var(--node)',
                amber: 'var(--amber)',
              },
              ink: {
                primary: 'var(--text-primary)',
                secondary: 'var(--text-secondary)',
                muted: 'var(--text-muted)',
              },
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'marquee': 'marquee 40s linear infinite',
              'draw': 'draw 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-node': 'pulseNode 2.4s ease-in-out infinite',
              'blink': 'blink 1.2s steps(2, start) infinite',
              'flow': 'flow 3s linear infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: 0, transform: 'translateY(20px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              draw: {
                '0%': { strokeDashoffset: '1000' },
                '100%': { strokeDashoffset: '0' },
              },
              pulseNode: {
                '0%, 100%': { opacity: 0.4, transform: 'scale(1)' },
                '50%': { opacity: 1, transform: 'scale(1.25)' },
              },
              blink: {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: 0 },
              },
              flow: {
                '0%': { strokeDashoffset: '24' },
                '100%': { strokeDashoffset: '0' },
              },
            }
          },
        },
      }
    </script>
    <style>
      :root {
        /* Blueprint — light ("paper") */
        --bg-base: #F4F7FE;
        --bg-section: #ECF1FC;
        --bg-surface: #FFFFFF;
        --bg-elevated: #FFFFFF;
        --border-subtle: rgba(30, 64, 150, 0.12);
        --border-strong: rgba(30, 64, 150, 0.28);
        --accent: #2862E6;
        --accent-bright: #1E54D4;
        --node: #0EA5C9;
        --amber: #E08600;
        --text-primary: #0A1430;
        --text-secondary: #45567D;
        --text-muted: #7C89A8;
        --grid-line: rgba(30, 64, 150, 0.07);
        --grid-line-strong: rgba(30, 64, 150, 0.10);
        --glow: rgba(40, 98, 230, 0.10);
      }
      .dark {
        /* Blueprint — dark ("schematic") */
        --bg-base: #070B16;
        --bg-section: #0A1020;
        --bg-surface: #0E1528;
        --bg-elevated: #131D36;
        --border-subtle: rgba(99, 140, 255, 0.12);
        --border-strong: rgba(99, 140, 255, 0.28);
        --accent: #3D7BFF;
        --accent-bright: #6CA0FF;
        --node: #38BDF8;
        --amber: #FFB020;
        --text-primary: #EAF0FF;
        --text-secondary: #93A4C9;
        --text-muted: #5B6B8F;
        --grid-line: rgba(99, 140, 255, 0.06);
        --grid-line-strong: rgba(99, 140, 255, 0.10);
        --glow: rgba(61, 123, 255, 0.16);
      }

      html { scroll-behavior: smooth; }

      body {
        background-color: var(--bg-base);
        color: var(--text-primary);
        overflow-x: hidden;
        width: 100%;
        min-height: 100vh;
        font-family: 'Hanken Grotesk', sans-serif;
        /* Blueprint grid: fine + coarse, plus an ambient glow */
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -10%, var(--glow), transparent 70%),
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
          linear-gradient(var(--grid-line-strong) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px);
        background-size:
          100% 100%,
          28px 28px,
          28px 28px,
          112px 112px,
          112px 112px;
        background-attachment: fixed;
      }

      ::selection { background: var(--accent); color: #fff; }

      /* Theme-switch transitions */
      body, div, section, nav, a, p, h1, h2, h3, h4, span, button {
        transition-property: color, background-color, border-color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 300ms;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: var(--bg-base); }
      ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 0; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }

      .text-balance { text-wrap: balance; }
    </style>
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "gsap": "https://esm.sh/gsap@^3.14.2",
    "gsap/ScrollTrigger": "https://esm.sh/gsap@^3.14.2/ScrollTrigger",
    "gsap/": "https://esm.sh/gsap@^3.14.2/",
    "three": "https://esm.sh/three@0.171.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
